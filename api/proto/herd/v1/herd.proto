syntax = "proto3";

package herd.v1;

option go_package = "github.com/nmstory/herd/api/proto/herd/v1;herdv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service HerdService {
    rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
    rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);
    rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);

    // Credits. Only available with the Postgres store.
    rpc TopUp(TopUpRequest) returns (Wallet);
    rpc GetWallet(GetWalletRequest) returns (Wallet);
    rpc ListStatement(ListStatementRequest) returns (ListStatementResponse);
}

enum DeviceState {
    DEVICE_STATE_UNSPECIFIED = 0;
    DEVICE_STATE_IDLE = 1;
    DEVICE_STATE_LEASED = 2;
    DEVICE_STATE_UNHEALTHY = 3;
    DEVICE_STATE_OFFLINE = 4;
}

message Device {
    string id = 1;
    map<string, string> labels = 2;  // model, os, arch, etc. (todo: define all labels)
    DeviceState state = 3;
    google.protobuf.Timestamp last_heartbeat = 4;
}

message ListDevicesRequest {
    map<string, string> selector = 1;  // empty: all devices
}

message ListDevicesResponse {
    repeated Device devices = 1;
}

message AcquireLeaseRequest {
    map<string, string> selector = 1;
    google.protobuf.Duration duration = 2;
    string holder = 3;           // identity of the client taking the lease
    string idempotency_key = 4;  // retries with the same (holder, key) return the original lease
}

message Lease {
    string id = 1;
    string device_id = 2;
    google.protobuf.Timestamp expires_at = 3;
    string holder = 4;
}

message AcquireLeaseResponse {
    Lease lease = 1;
}

message ReleaseLeaseRequest {
    string lease_id = 1;
    string holder = 2;
}

message ReleaseLeaseResponse {}
message Wallet {
    string holder = 1;
    int64 available = 2;  // spendable credits
    int64 held = 3;       // reserved by leases that haven't settled
}

message TopUpRequest {
    string holder = 1;
    int64 amount = 2;
    string idempotency_key = 3;
}

message GetWalletRequest {
    string holder = 1;
}

message ListStatementRequest {
    string holder = 1;
    int32 limit = 2;  // most recent entries; 0 means 50
}

message StatementLine {
    int64 entry_id = 1;
    string kind = 2;      // topup, hold, capture, expire
    string lease_id = 3;
    int64 amount = 4;     // change to the wallet
    int64 charged = 5;    // credits charged for device time in this entry
    int64 balance = 6;    // wallet balance after this entry
    google.protobuf.Timestamp at = 7;
}

message ListStatementResponse {
    repeated StatementLine lines = 1;
}
